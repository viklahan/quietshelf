[project]
name = "quiet-shelf"
version = "1.0.0"
description = "A writer's toolkit: manuscript in, finished sellable things out."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
quiet-shelf = "app.cli:app"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Only collect test_*.py. pytest's other default glob, *_test.py, would pick up
# tests/qs_e2e_test.py -- a standalone script that hits the LIVE prod site and
# calls sys.exit() at module level, which aborts collection (INTERNALERROR) and
# silently prevents the entire suite from running. Run it by hand instead:
#   python tests/qs_e2e_test.py
python_files = ["test_*.py"]
testpaths = ["tests"]
