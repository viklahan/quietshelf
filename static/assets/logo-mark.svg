<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Quiet Shelf mark: inkpot + quill + QS. Designed to match the app's
       ink/ember/oxblood palette. SVG scales cleanly from 16px favicon to
       large hero without separate exports. -->
  <!-- Ink splash -->
  <ellipse cx="100" cy="148" rx="52" ry="14" fill="#c5893b" opacity="0.35"/>
  <ellipse cx="72" cy="155" rx="12" ry="5" fill="#c5893b" opacity="0.25" transform="rotate(-15 72 155)"/>
  <ellipse cx="132" cy="153" rx="9" ry="4" fill="#c5893b" opacity="0.2" transform="rotate(10 132 153)"/>
  <!-- Pot body -->
  <path d="M68 145 L72 110 Q74 104 100 104 Q126 104 128 110 L132 145 Z" fill="#7e2b23"/>
  <!-- Pot rim -->
  <ellipse cx="100" cy="107" rx="30" ry="8" fill="#9a3528"/>
  <!-- Ink surface -->
  <ellipse cx="100" cy="107" rx="26" ry="6" fill="#d9a458"/>
  <!-- Pot highlight -->
  <path d="M74 118 Q72 130 73 142" stroke="rgba(255,255,255,0.12)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- QS label -->
  <rect x="80" y="122" width="40" height="16" rx="3" fill="rgba(0,0,0,0.25)"/>
  <text x="100" y="134" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="#d9a458" letter-spacing="1">QS</text>
  <!-- Quill shaft -->
  <line x1="100" y1="107" x2="145" y2="28" stroke="#c5893b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Feather left vane -->
  <path d="M100 107 C 90 95, 82 78, 86 55 C 88 45, 92 36, 97 28 C 102 35, 108 50, 108 65 C 108 82, 106 95, 100 107 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Feather right vane -->
  <path d="M100 107 C 108 95, 118 78, 122 55 C 126 40, 130 33, 133 28 C 138 32, 142 38, 143 45 C 144 58, 138 75, 128 88 C 118 100, 108 105, 100 107 Z" fill="#f0e8d8" opacity="0.9"/>
  <!-- Feather spine -->
  <line x1="100" y1="107" x2="133" y2="28" stroke="#c9b8a0" stroke-width="0.8" opacity="0.7"/>
  <!-- Barb lines left -->
  <line x1="96" y1="95" x2="84" y2="88" stroke="#d0c8b8" stroke-width="0.6" opacity="0.6"/>
  <line x1="93" y1="82" x2="83" y2="72" stroke="#d0c8b8" stroke-width="0.6" opacity="0.6"/>
  <line x1="91" y1="68" x2="84" y2="58" stroke="#d0c8b8" stroke-width="0.6" opacity="0.6"/>
  <line x1="92" y1="54" x2="87" y2="44" stroke="#d0c8b8" stroke-width="0.6" opacity="0.6"/>
  <!-- Barb lines right -->
  <line x1="104" y1="95" x2="114" y2="90" stroke="#c8bfb0" stroke-width="0.6" opacity="0.5"/>
  <line x1="107" y1="82" x2="118" y2="75" stroke="#c8bfb0" stroke-width="0.6" opacity="0.5"/>
  <line x1="110" y1="68" x2="122" y2="60" stroke="#c8bfb0" stroke-width="0.6" opacity="0.5"/>
  <line x1="114" y1="54" x2="127" y2="46" stroke="#c8bfb0" stroke-width="0.6" opacity="0.5"/>
  <!-- Nib -->
  <path d="M98 107 Q100 114 102 107" fill="#8a6a20" opacity="0.8"/>
</svg>
