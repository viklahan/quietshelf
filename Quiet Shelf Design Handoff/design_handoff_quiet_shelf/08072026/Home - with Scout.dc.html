<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="app/tokens/fonts-newsreader.css">
  <link rel="stylesheet" href="app/tokens/fonts-source-serif-4.css">
  <link rel="stylesheet" href="app/tokens/fonts-ibm-plex-mono.css">
  <link rel="stylesheet" href="app/tokens/colors.css">
  <link rel="stylesheet" href="app/tokens/typography.css">
  <link rel="stylesheet" href="app/tokens/spacing.css">
  <link rel="stylesheet" href="app/tokens/base.css">
  <link rel="stylesheet" href="app/kit.css">
  <link rel="stylesheet" href="app/refresh.css">
  <script src="app/_ds_bundle.js"></script>
  <style>
    a { color: var(--ember-400); } a:hover { color: var(--ember-500); }
    .qs-door--wide { flex-direction: row; align-items: center; gap: var(--space-5); grid-column: 1 / -1; }
    .qs-door--wide .qs-door__title { margin-top: 0; }
    .qs-door--wide .qs-door__go { margin-left: auto; }
  </style>
</helmet>
<div class="qs-app">
  <header class="qs-header">
    <button type="button" class="qs-brand" aria-label="Quiet Shelf, home"><img src="app/assets/logo-mark.svg" alt="" width="26" height="26" style="display: block"><span class="qs-brand__text"><span class="qs-brand__name">Quiet Shelf</span><span class="qs-brand__sub">Your story, made real.</span></span></button>
    <nav class="qs-nav" aria-label="Sections">
      <button type="button" class="qs-nav__tab"><svg class="qs-nav__ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg><span>Format</span></button>
      <button type="button" class="qs-nav__tab"><svg class="qs-nav__ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"></path><path d="M16 8 2 22"></path><path d="M17.5 15H9"></path></svg><span>Blurb</span></button>
      <button type="button" class="qs-nav__tab"><svg class="qs-nav__ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 3v18"></path><path d="M3 7.5h4"></path><path d="M3 12h18"></path><path d="M3 16.5h4"></path><path d="M17 3v18"></path><path d="M17 7.5h4"></path><path d="M17 16.5h4"></path></svg><span>Promote</span></button>
      <button type="button" class="qs-nav__tab"><svg class="qs-nav__ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span>Story Map</span></button>
      <button type="button" class="qs-nav__tab"><svg class="qs-nav__ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg><span>Scout</span></button>
      <button type="button" class="qs-nav__tab" style="opacity: 0.7"><span>About</span></button>
    </nav>
  </header>
  <main class="qs-main">
    <div class="qs-page qs-home" data-screen-label="Home · with Scout door">
      <div class="qs-home__hero">
        <h1 class="qs-home__name">Quiet Shelf</h1>
        <p class="qs-home__tag">Your story, made real.</p>
        <p class="qs-home__intro">You&rsquo;ve carried this long enough. Set it down here, and let it become something you can hold. Choose where you&rsquo;d like to begin.</p>
      </div>
      <div class="qs-doors">
        <button type="button" class="qs-door">
          <span class="qs-door__ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span>
          <h2 class="qs-door__title">Format</h2>
          <p class="qs-door__line">Turn your manuscript into a beautiful book.</p>
          <span class="qs-door__go">Open<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </button>
        <button type="button" class="qs-door">
          <span class="qs-door__ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"></path><path d="M16 8 2 22"></path><path d="M17.5 15H9"></path></svg></span>
          <h2 class="qs-door__title">Blurb</h2>
          <p class="qs-door__line">Find the words to describe your book.</p>
          <span class="qs-door__go">Open<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </button>
        <button type="button" class="qs-door qs-door--wide" data-screen-label="Scout door (new)">
          <span class="qs-door__ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path><path d="M20 3v4"></path><path d="M22 5h-4"></path><path d="M4 17v2"></path><path d="M5 18H3"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: var(--space-1); min-width: 0">
            <h2 class="qs-door__title" style="margin-top: 0">Scout</h2>
            <p class="qs-door__line">Hear what people are asking right now, before you write.</p>
          </span>
          <span class="qs-door__go">Open<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </button>
        <button type="button" class="qs-door">
          <span class="qs-door__ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 3v18"></path><path d="M3 7.5h4"></path><path d="M3 12h18"></path><path d="M3 16.5h4"></path><path d="M17 3v18"></path><path d="M17 7.5h4"></path><path d="M17 16.5h4"></path></svg></span>
          <h2 class="qs-door__title">Promote</h2>
          <p class="qs-door__line">Turn your writing into a video plan.</p>
          <span class="qs-door__go">Open<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </button>
        <button type="button" class="qs-door">
          <span class="qs-door__ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
          <h2 class="qs-door__title">Story Map</h2>
          <p class="qs-door__line">See who&rsquo;s in your story, and how they connect.</p>
          <span class="qs-door__go">Open<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </button>
      </div>
      <div class="qs-shelfwrap">
        <p class="qs-shelfcap">Your shelf is waiting</p>
        <div class="qs-shelf">
          <div class="qs-shelf__glow" aria-hidden="true"></div>
          <div class="qs-shelf__books"></div>
          <div class="qs-shelf__plank"></div>
          <div class="qs-shelf__lip"></div>
        </div>
        <p class="qs-quiethint" style="display: block; text-align: center; margin-top: var(--space-6)">Format your first manuscript, and it&rsquo;ll feel like it belongs on a shelf.</p>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
